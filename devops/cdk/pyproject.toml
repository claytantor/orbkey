[project]
name = "orbkey-cdk"
version = "0.1.0"
description = "CDK infrastructure for orbkey (TypeScript / Ink edition)"
requires-python = ">=3.11"
dependencies = [
    "aws-cdk-lib>=2.140.0",
    "constructs>=10.0.0,<11.0.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["orbkey_stack"]

[dependency-groups]
dev = ["ruff>=0.6.0"]
